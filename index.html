<!doctype html>

    <link rel="stylesheet" href="./style.css" />

        <img

    </section>

            <div class="project one">

            <div class="project one">

            <img src="./img/html.png" alt="html logo" width="75px" />

          <div class="another-image two">
            <img src="./img/css.png" alt="css logo" width="100px" />
          </div>

            <img src="./img/vs code.png" alt="VSCODE logo" width="75px" />

        role="dialog"
        id="modalTour"
      >
        <div class="modal-dialog">
          <div class="modal-content rounded-4 shadow">
            <div class="modal-body p-5">
              <h2 class="color" class="fw-bold mb-0 text-center">
                Get In Touch
              </h2>

              <button
                onclick="
                  location.href =
                    'https://michael-ay-dotcom.github.io/html-portfolio2/contact/contact.html'

                type="button"
                class="btn btn-lg btn-primary mt-5 w-100"
                data-bs-dismiss="modal"

          </div>

    <section class="glossy-blue-gradient">
